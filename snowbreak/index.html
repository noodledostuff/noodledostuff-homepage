<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#919ca7">
  <link rel="icon" href="assets/lyfe-icon.webp">
  <title>Snowbreak · Heimdall Force</title>
  <link rel="stylesheet" href="scene.css">
  <script type="module" src="scene.js"></script>
</head>
<body data-view="lobby">
  <main>
    <section id="lobby" class="scene" aria-label="Main lobby">
      <img class="lobby-lyfe" src="assets/lyfe.webp" alt="Lyfe in her Wednesday exosuit">
      <header class="lobby-bar">
        <div class="adjutant"><img src="assets/lyfe-icon.webp" alt=""><div>Adjutant<small>Lv. 20</small></div></div>
        <div class="wallet" aria-label="Resources">
          <span title="Presence"><img src="assets/money-3.webp" alt="Presence">160/160</span>
          <span title="Silverbuck"><img src="assets/money-0.webp" alt="Silverbuck"><b data-balance>12,000</b></span>
          <span title="DigiCash"><img src="assets/money-1.webp" alt="DigiCash">120</span>
          <span title="BitGold"><img src="assets/money-2.webp" alt="BitGold">0</span>
        </div>
        <img class="settings-icon" src="assets/settings.webp" alt="Settings">
      </header>
      <div class="left-rail">
        <div class="social"><img src="assets/mail.webp" alt="Mail"><img src="assets/notice.webp" alt="Notices"><img src="assets/friend.webp" alt="Friends"></div>
        <div class="promos"><span class="quarter">Quartermaster</span><span class="pass">Battle Pass</span><span class="events">Events</span></div>
      </div>
      <div class="right-rail">
        <div class="task"><strong>Tasks</strong><span>Complete Main Story 1-4<br>on Normal Mode</span></div>
        <div class="fight"><strong>Fight</strong><span>Chapter 1 Progress 3</span><div class="chapter"><i></i>37% <img src="assets/fast.webp" alt=""></div></div>
        <div class="echo">Echo</div>
        <div class="shortcuts"><span><img src="assets/base.webp" alt="">Base</span><a id="open-operative" href="#level"><i aria-hidden="true">Ⅲ</i> Operatives</a></div>
      </div>
      <div class="lobby-foot"><span><img src="assets/archive.webp" alt="">Archives</span><span><i aria-hidden="true">⬡</i>Storage</span><span><img src="assets/shop.webp" alt="">Shop</span></div>
    </section>

    <section id="operative" class="scene" hidden aria-label="Operative development">
      <header class="operative-bar"><h1 tabindex="-1">Operative</h1><a class="return" href="#lobby" aria-label="Return to lobby">‹</a></header>
      <nav class="mode-nav" aria-label="Operative development"><a href="#level">Level Up</a><a href="#skills">Neuronics</a></nav>
      <div id="level">
        <img class="studio-lyfe" src="assets/lyfe.webp" alt="Lyfe in her native standing pose">
        <div class="identity"><span>Wednesday</span><h2>Lyfe</h2><div class="rarity" aria-label="Four-star operative">★★★★</div></div>
        <section class="training" aria-label="Level up Lyfe">
          <div class="training-head"><h2>Level Up</h2><span><img src="assets/money-0.webp" alt="Silverbuck"><b data-balance>12,000</b></span></div>
          <div class="level-line"><span>Lv. <b id="rank">1</b><small> / 20</small></span><strong id="projected"></strong></div>
          <div class="exp-line"><span>EXP</span><output id="exp-value"></output></div>
          <progress id="exp-bar" aria-label="Current level experience"></progress>
          <dl id="stats"></dl>
          <div class="record-head"><h3>Combat Records</h3><button id="clear-records" type="button">Clear</button></div>
          <div id="records" aria-label="Select combat records"></div>
          <div class="cost"><span>Cost</span><strong><img src="assets/money-0.webp" alt="Silverbuck"><output id="cost">0</output></strong></div>
          <button class="apply" id="train" type="button">Level Up</button>
          <p id="training-result" role="status"></p>
        </section>
      </div>
      <section id="skills" hidden aria-label="Neuronics">
        <div class="neural-map" role="group" aria-label="Lyfe’s neuronics clusters">
          <svg viewBox="0 0 1000 600" preserveAspectRatio="none" aria-hidden="true"><path d="M430 300 300 145 180 145 M430 300 180 300 M430 300 315 458 220 458 M430 300 595 145 795 145 M430 300 780 300 M430 300 595 458 750 458"/></svg>
          <div class="neural-core"><img src="assets/lyfe-icon.webp" alt="Lyfe"></div>
          <div id="clusters"></div>
        </div>
        <aside class="skill-info" aria-live="polite"><div class="skill-type"></div><h2></h2><p></p><div class="node-rule"></div><h3></h3><p class="effect"></p></aside>
      </section>
    </section>
  </main>
  <noscript><p class="no-script">Enable JavaScript to open operative development.</p></noscript>
</body>
</html>
